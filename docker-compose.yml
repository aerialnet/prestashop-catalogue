version: '3.7'

services:
  prestashop:
    image: prestashop:latest
    restart: always
    ports:
      - '80:80'
    environment:
      - PS_HOST=localhost
      - PS_DEV_MODE=0
      - DB_SERVER=db
      - DB_USER=prestashop
      - DB_PASS=prestashop_pass
      - DB_NAME=prestashop_db
    volumes:
      - prestashop_data:/var/www/html

  db:
    image: mysql:5.7
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=prestashop_db
      - MYSQL_USER=prestashop
      - MYSQL_PASSWORD=prestashop_pass
    volumes:
      - db_data:/var/lib/mysql

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - prestashop_data:/var/www/html

volumes:
  prestashop_data:
  db_data: