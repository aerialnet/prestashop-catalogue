version: '3.8'

services:
  db:
    image: mysql:5.7
    container_name: prestashop_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-prestashop_db}
      MYSQL_USER: ${MYSQL_USER:-prestashop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-prestashop_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - prestashop_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prestashop:
    image: prestashop/prestashop:latest
    container_name: prestashop_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PS_PORT:-8080}:80"
    environment:
      DB_SERVER: db
      DB_NAME: ${MYSQL_DATABASE:-prestashop_db}
      DB_USER: ${MYSQL_USER:-prestashop}
      DB_PASSWD: ${MYSQL_PASSWORD:-prestashop_pass}
      PS_DOMAIN: ${PS_DOMAIN:-localhost:8080}
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN:-admin}
      PS_FOLDER_INSTALL: ${PS_FOLDER_INSTALL:-install}
      PS_COUNTRY: ${PS_COUNTRY:-US}
      PS_LANGUAGE: ${PS_LANGUAGE:-en}
      PS_INSTALL_AUTO: ${PS_INSTALL_AUTO:-0}
      PS_DEV_MODE: ${PS_DEV_MODE:-0}
      PS_ENABLE_SSL: ${PS_ENABLE_SSL:-0}
      ADMIN_MAIL: ${ADMIN_MAIL:-admin@example.com}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-admin123}
    volumes:
      - prestashop_data:/var/www/html
      - ./theme:/var/www/html/themes/minimalist_catalogue
    networks:
      - prestashop_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/index.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: prestashop_nginx
    restart: always
    depends_on:
      - prestashop
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - prestashop_data:/var/www/html:ro
    networks:
      - prestashop_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  prestashop_network:
    driver: bridge

volumes:
  prestashop_data:
    driver: local
  db_data:
    driver: local